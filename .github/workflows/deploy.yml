name: Build & Deploy

# Verification runs on every push and pull request, so any change is proven
# deployable before it reaches main. Only main actually publishes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      # Asserts the things that have silently broken before: a missing sitemap,
      # a social card with no image extension, or a half-generated locale tree.
      - name: Verify build output
        run: |
          set -e
          required=(
            out/index.html
            out/id.html
            out/about.html
            out/id/about.html
            out/work.html
            out/id/work.html
            out/404.html
            out/sitemap.xml
            out/robots.txt
            out/llms.txt
            out/opengraph-image.png
            out/CNAME
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

          grep -q 'hrefLang="id-ID"' out/about.html \
            || { echo "::error::hreflang alternates missing"; exit 1; }
          grep -q 'OAI-SearchBot' out/robots.txt \
            || { echo "::error::AI crawler rules missing from robots.txt"; exit 1; }
          ! grep -rq 'localhost:3000' out/ \
            || { echo "::error::localhost URL leaked into the build"; exit 1; }

          echo "Verified $(find out -name '*.html' | wc -l) HTML routes."

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
