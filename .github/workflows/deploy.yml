name: Build & Deploy

# One run per change, never two.
#
# `push` is restricted to main because branch work is verified through its pull
# request. Listening to both `push: ['**']` and `pull_request` meant every commit
# on a branch with an open PR started two identical runs, and whichever one was
# cancelled left a red check on the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR and its branch share a group, so a new commit supersedes the run in flight
# instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege by default; only the deploy job gets write access.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production

      # Asserts the things that have silently broken before: a missing sitemap,
      # a social card with no image extension, a half-generated locale tree, or
      # hreflang that disagrees between the markup and the sitemap.
      - name: Verify build output
        run: |
          set -euo pipefail
          required=(
            out/index.html
            out/id.html
            out/about.html
            out/id/about.html
            out/work.html
            out/id/work.html
            out/404.html
            out/sitemap.xml
            out/robots.txt
            out/llms.txt
            out/opengraph-image.png
            out/CNAME
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

          grep -q 'hrefLang="id-ID"' out/about.html \
            || { echo "::error::hreflang alternates missing from markup"; exit 1; }
          grep -q 'hreflang="id-ID"' out/sitemap.xml \
            || { echo "::error::sitemap hreflang does not match the markup"; exit 1; }
          grep -q 'hreflang="x-default"' out/sitemap.xml \
            || { echo "::error::sitemap x-default missing"; exit 1; }
          grep -q 'OAI-SearchBot' out/robots.txt \
            || { echo "::error::AI crawler rules missing from robots.txt"; exit 1; }
          if grep -rq 'localhost:3000' out/; then
            echo "::error::localhost URL leaked into the build"; exit 1
          fi

          echo "Verified $(find out -name '*.html' | wc -l) HTML routes."

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: out
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: out

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
